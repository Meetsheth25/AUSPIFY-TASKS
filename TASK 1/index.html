<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A real-time responsive digital clock application built with HTML5, CSS3, and Vanilla JavaScript.">
  <title>Digital Clock</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts for modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-glow background-glow-1"></div>
  <div class="background-glow background-glow-2"></div>

  <main class="clock-container" role="main">
    <!-- Main Card Container -->
    <article class="clock-card" aria-label="Digital Clock Display">
      
      <!-- Top Status Header -->
      <header class="card-header">
        <div class="status-badge" aria-label="Clock Status: Live">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-text">LIVE CLOCK</span>
        </div>
        <h1 class="app-title">Digital Clock</h1>
        <p class="app-subtitle">Real-time clock powered by JavaScript</p>
      </header>

      <!-- Digital Clock Display Section -->
      <section class="clock-display-section" aria-live="off">
        <div class="time-display" id="timeDisplay">
          <!-- Hours Box -->
          <div class="time-unit">
            <span class="time-number" id="hours">12</span>
            <span class="time-label">HOURS</span>
          </div>

          <!-- Separator -->
          <span class="time-colon" aria-hidden="true">:</span>

          <!-- Minutes Box -->
          <div class="time-unit">
            <span class="time-number" id="minutes">00</span>
            <span class="time-label">MINUTES</span>
          </div>

          <!-- Separator -->
          <span class="time-colon" aria-hidden="true">:</span>

          <!-- Seconds Box -->
          <div class="time-unit">
            <span class="time-number" id="seconds">00</span>
            <span class="time-label">SECONDS</span>
          </div>

          <!-- AM/PM Indicator Badge -->
          <div class="ampm-unit" aria-label="Meridiem Period">
            <span class="ampm-badge" id="ampm">AM</span>
          </div>
        </div>
      </section>

      <!-- Date Display Section -->
      <section class="date-section">
        <div class="date-wrapper">
          <svg class="calendar-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="date-text" id="dateText">Thursday, October 22, 2026</span>
        </div>
      </section>

      <!-- Card Footer -->
      <footer class="card-footer">
        <p class="footer-text">Built with HTML, CSS &amp; JavaScript</p>
      </footer>

    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
