<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="90" fill="#4338ca" opacity="0.3" />
  <g transform="translate(100, 50)">
    <!-- Headband -->
    <path d="M 40 100 A 60 60 0 0 1 160 100" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 50 90 A 50 50 0 0 1 150 90" fill="none" stroke="#818cf8" stroke-width="4" stroke-dasharray="4 4"/>
    <!-- Earcups -->
    <rect x="25" y="95" width="30" height="55" rx="15" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="4"/>
    <rect x="145" y="95" width="30" height="55" rx="15" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="4"/>
    <ellipse cx="40" cy="122" rx="7" ry="16" fill="#a855f7" opacity="0.8"/>
    <ellipse cx="160" cy="122" rx="7" ry="16" fill="#a855f7" opacity="0.8"/>
    <!-- Sound Waves -->
    <path d="M 15 110 A 20 20 0 0 0 15 135" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <path d="M 185 110 A 20 20 0 0 1 185 135" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="200" y="240" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e0e7ff" text-anchor="middle" letter-spacing="1">AUDIO &amp; SOUND</text>
</svg>
