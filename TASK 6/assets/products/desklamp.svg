<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <rect width="400" height="300" rx="16" fill="#0f172a"/>
    <g transform="translate(140, 60)">
      <!-- Base -->
      <ellipse cx="60" cy="145" rx="40" ry="10" fill="#334155" stroke="#64748b" stroke-width="2"/>
      <!-- Arm -->
      <line x1="60" y1="145" x2="40" y2="75" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <line x1="40" y1="75" x2="85" y2="40" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <circle cx="40" cy="75" r="6" fill="#38bdf8"/>
      <!-- Head / Shade -->
      <path d="M 75 30 L 110 50 L 95 65 L 70 45 Z" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
      <!-- Light Beam -->
      <polygon points="90,60 135,130 55,130" fill="#fde047" opacity="0.15"/>
    </g>
    <text x="200" y="245" font-family="sans-serif" font-size="13" font-weight="600" fill="#fcd34d" text-anchor="middle" letter-spacing="1.5">SMART AMBIENT LAMP</text>
  </svg>